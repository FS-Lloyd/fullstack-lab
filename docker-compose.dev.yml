services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - app-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: builder # source stage — skip prod's npm ci --omit=dev
    command: npm run start:dev # nest start --watch
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true' # reliable file-change detection on bind mounts
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./apps/api:/app
      - /app/node_modules # anonymous volume: keep container's installed modules
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: builder
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_PROXY_TARGET: http://api:3000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    depends_on:
      - api
    networks:
      - app-net

volumes:
  pgdata_dev:

networks:
  app-net:
    driver: bridge
